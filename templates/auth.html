<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ "Create account" if mode == "register" else "Sign in" }} · RPS Chaos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='account.css') }}">
  </head>
  <body>
    <main class="account-page">
      <h1 class="logo">RPS<span>Chaos</span></h1>
      <h2>{{ "Create your account" if mode == "register" else "Sign in" }}</h2>
      {% if error %}<p class="account-error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" class="account-form">
        <label>Email <input type="email" name="email" required autocomplete="email"></label>
        {% if mode == "register" %}
        <label>Display name <input type="text" name="display_name" maxlength="40"></label>
        {% endif %}
        <label>Password
          <input type="password" name="password" required minlength="8"
                 autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}">
        </label>
        <button type="submit">{{ "Create account" if mode == "register" else "Sign in" }}</button>
      </form>
      {% if mode == "register" %}
      <p>Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
      {% else %}
      <p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
      {% endif %}
      <p><a href="{{ url_for('index') }}">Play without saving</a></p>
    </main>
  </body>
</html>
